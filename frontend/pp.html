<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickService - Login</title>
    <link rel="stylesheet" href="style.css">
<style data-page>
body { min-height: 100vh; display: flex; flex-direction: column; background: linear-gradient(135deg, #e8f2ef 0%, #f3f6f8 100%); }
header { justify-content: center; text-align: center; background: transparent; }
main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.box { width: 100%; max-width: 420px; margin: 0 auto; padding: 28px 26px; border-radius: 14px; background: #fff; box-shadow: 0 12px 30px rgba(15,60,55,.14); }
.box h2 { text-align: center; margin-top: 0; }
label { display: block; margin: 12px 0 4px; font-weight: bold; font-size: 14px; }
input { width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line); }
input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(20,125,114,.18); }
.full { width: 100%; margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 16px; }
.small-link { text-align: center; margin-top: 14px; font-size: 14px; }
footer { text-align: center; }
@media (max-width: 480px) { .box { padding: 22px 16px; } }
</style>
</head>
<body class="login-page">

<header>
    <h1>QuickService</h1>
    <p>All home services at one stop</p>
</header>

<main>
    <div class="box">
        <h2>Login</h2>

        <form id="loginForm">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>

            <p style="text-align:right; margin:8px 0 0;"><a href="forget password.html">Forgot password?</a></p>

            <button type="submit" class="full">Login</button>
        </form>

        <div id="message"></div>

        <p class="small-link">Do not have an account? <a href="ceate.html">Create Account</a></p>
    </div>
</main>

<footer>
    <p>&copy; 2026 QuickService. All rights reserved.</p>
    <p><a href="more.html">About Us</a> | <a href="copyright.html">Copyright Policy</a></p>
</footer>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDn15soeEJeuYfEvQyvzK-MKWZCuhgGx9g",
        authDomain: "quickservice-da485.firebaseapp.com",
        projectId: "quickservice-da485",
        storageBucket: "quickservice-da485.firebasestorage.app",
        messagingSenderId: "348321079075",
        appId: "1:348321079075:web:561fb3f738cb40023db696",
        measurementId: "G-Z7LXSELJK2"
    };

    const auth = getAuth(initializeApp(firebaseConfig));
    const message = document.getElementById("message");

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
    }

    document.getElementById("loginForm").addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {
            await signInWithEmailAndPassword(auth, email, password);
            showMessage("Login successful. Redirecting...", "success");
            setTimeout(function () {
                window.location.href = "op.html";
            }, 1000);
        } catch (error) {
            if (error.code === "auth/too-many-requests") {
                showMessage("Too many failed attempts. Please try again later.", "error");
            } else {
                showMessage("Wrong email or password. Create an account if you do not have one.", "error");
            }
        }
    });
</script>
</body>
</html>
